apiVersion: v1
kind: Secret
metadata:
  name: cybersentil-secrets
type: Opaque
stringData:
  # Database credentials
  database-url: "postgresql://cybersentinel:CHANGE_ME@postgres:5432/cybersentinel"
  postgres-db: "cybersentinel"
  postgres-user: "cybersentinel"
  postgres-password: "REPLACE_WITH_STRONG_PASSWORD"
  
  # Redis credentials
  redis-url: "redis://redis:6379/0"
  
  # Application secrets
  secret-key: "REPLACE_WITH_STRONG_SECRET_KEY"
  
  # Protocol secrets
  protocol-shared-secret: "REPLACE_WITH_PROTOCOL_SECRET"
  
  # SMTP credentials
  smtp-password: "REPLACE_WITH_SMTP_PASSWORD"
  
  # Cloudflare tunnel token
  cloudflare-tunnel-token: "REPLACE_WITH_CLOUDFLARE_TOKEN"
