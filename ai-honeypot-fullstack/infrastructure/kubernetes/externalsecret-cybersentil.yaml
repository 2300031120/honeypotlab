apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cybersentil-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cybersentil-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  # Map remote AWS Secrets Manager entries to Kubernetes Secret keys.
  # Replace remoteRef.key values with the actual secret names you create in AWS Secrets Manager.
  data:
  - secretKey: database-url
    remoteRef:
      key: cybersentil/database-url
  - secretKey: postgres-db
    remoteRef:
      key: cybersentil/postgres-db
  - secretKey: postgres-user
    remoteRef:
      key: cybersentil/postgres-user
  - secretKey: postgres-password
    remoteRef:
      key: cybersentil/postgres-password
  - secretKey: redis-url
    remoteRef:
      key: cybersentil/redis-url
  - secretKey: secret-key
    remoteRef:
      key: cybersentil/secret-key
  - secretKey: protocol-shared-secret
    remoteRef:
      key: cybersentil/protocol-shared-secret
  - secretKey: smtp-password
    remoteRef:
      key: cybersentil/smtp-password
  - secretKey: cloudflare-tunnel-token
    remoteRef:
      key: cybersentil/cloudflare-tunnel-token
