map $http_x_forwarded_proto $cybersentil_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health/detailed {
        proxy_pass http://backend:5000/health/detailed;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cybersentil_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://backend:5000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cybersentil_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location ^~ /admin/leads {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(phpmyadmin|wp-admin|admin)(/|$) {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cybersentil_forwarded_proto;
    }

    location ~ ^/(wp-login\.php|xmlrpc\.php|robots\.txt|\.env|\.git/config|config\.php|backup\.zip|backup\.sql|db\.sql|server-status|actuator/env|actuator/health|api/v1/users|ssh/fingerprint|canary/) {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cybersentil_forwarded_proto;
    }

    location = /favicon.svg {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /screenshots/ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /incident-report.md {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/(?!api/|ws/).*\.(?:html?|json|txt|xml|md|svg|png|jpe?g|gif|webp|avif|css|js|mjs|ico|pdf|woff2?|map)$ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location ^~ /fonts/ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        rewrite ^/(platform|resources|integrations|deployment|pricing|case-study|screenshots|architecture|use-cases|security|privacy|terms|contact|demo)$ /$1/index.html last;
        try_files $uri $uri/ /fallback.html;
        add_header Cache-Control "no-store";
    }
}
